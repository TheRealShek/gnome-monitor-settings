[package]
name = "gnome-monitor-settings"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "GNOME controls for DDC/CI monitor settings"

[lib]
name = "gnome_monitor_settings"
path = "src/lib.rs"

[[bin]]
name = "gnome-monitor-settings-service"
path = "src/bin/service.rs"

[[bin]]
name = "gnome-monitor-settings"
path = "src/bin/app.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dependencies.gtk]
package = "gtk4"
version = "0.11.4"
features = ["gnome_50"]

[dependencies.adw]
package = "libadwaita"
version = "0.9.2"
features = ["v1_9", "gtk_v4_22"]

[dev-dependencies]
pretty_assertions = "1.4"
